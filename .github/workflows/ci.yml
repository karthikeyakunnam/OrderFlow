name: CartNova CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build every service
        run: |
          for service in gateway user-service product-service order-service inventory-service notification-service; do
            go build -trimpath -o "/tmp/cartnova-${service}" "./cmd/${service}"
          done

      - name: Validate Docker build
        run: docker build --build-arg SERVICE=gateway --build-arg GO_BUILD_PARALLELISM=2 .
